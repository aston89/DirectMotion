      - name: Verify persistent AviSynth runtime session source contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = Get-Content -Raw '.\directmotion\AviSynthMvToolsEngine.cpp'
          $header = Get-Content -Raw '.\directmotion\AviSynthMvToolsEngine.h'
          if ($engine -notmatch 'AviSynthRuntimeSession::EnsureReady') { throw 'Persistent runtime-session initializer is missing.' }
          if ($engine -notmatch 'if \(m_ready && m_env\)') { throw 'Runtime-session reuse fast path is missing.' }
          if ($engine -notmatch 'AviSynthRuntimeSession::DestroyEnvironment') { throw 'Runtime-session teardown is missing.' }
          $graphReset = $engine.Substring($engine.IndexOf('void AviSynthMvToolsEngine::Reset() noexcept'))
          if ($graphReset -match 'DeleteScriptEnvironment') { throw 'Graph reset must not destroy the retained script environment.' }
          if ($header.IndexOf('m_avisynthRuntimeSession') -gt $header.IndexOf('std::unique_ptr<ActiveFrucEngine> m_engine')) { throw 'Runtime session must outlive the graph engine.' }

