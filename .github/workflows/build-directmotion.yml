name: Build directmotion (AviSynth+ / MVTools2 only)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win64:
    name: Build DirectShow filter (x64)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Configure Python for workflow validation
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
          check-latest: false

      - name: Obtain AviSynth+ SDK headers (compile-time only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'AviSynthPlus'
          $avisynthTag = 'v3.7.5'
          $expectedCommitPrefix = '6c7c266'
          git clone --depth 1 --branch $avisynthTag --single-branch https://github.com/AviSynth/AviSynthPlus.git $root
          if ($LASTEXITCODE -ne 0) { throw "AviSynth+ checkout failed with exit code $LASTEXITCODE" }
          $actualCommit = (git -C $root rev-parse HEAD).Trim()
          if (-not $actualCommit.StartsWith($expectedCommitPrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "AviSynth+ pin mismatch: expected v3.7.5/$expectedCommitPrefix, received $actualCommit"
          }
          $headName = (git -C $root rev-parse --abbrev-ref HEAD).Trim()
          if ($headName -ne 'HEAD') { throw "AviSynth+ checkout is not detached: $headName" }
          Write-Host "AviSynth+ compile-time headers pinned to $avisynthTag ($actualCommit)"
          $candidates = @(
            (Join-Path $root 'include\avisynth.h'),
            (Join-Path $root 'avs_core\include\avisynth.h')
          )
          if (-not ($candidates | Where-Object { Test-Path -LiteralPath $_ })) {
            throw 'AviSynth+ checkout does not contain avisynth.h in a supported location.'
          }
          Add-Content -Path $env:GITHUB_ENV -Value "AVISYNTH_ROOT=$root"

      - name: Install Python validation dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check -r .\tools\requirements-validation.txt
          if ($LASTEXITCODE -ne 0) { throw "Validation dependency installation failed with exit code $LASTEXITCODE" }
          python --version
          if ($LASTEXITCODE -ne 0) { throw "Python version check failed with exit code $LASTEXITCODE" }
          python -c "import sys, yaml; print('Python runtime:', sys.version); print('PyYAML runtime:', yaml.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Validation runtime identification failed with exit code $LASTEXITCODE" }

      - name: Parse compact seek trace extraction script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\tools\extract_seek_trace.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }

      - name: Run source and scheduler validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $validationLog = Join-Path $env:RUNNER_TEMP 'VALIDATION_RUN_0.2.58.28.txt'
          python .\tools\validate_sync_pipeline.py | Tee-Object -FilePath $validationLog
          if ($LASTEXITCODE -ne 0) { throw "Static validation failed with exit code $LASTEXITCODE" }

      - name: Run bootstrap queue state regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe was not found.' }
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'A Visual C++ x64 toolset installation was not found.' }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars)) { throw 'vcvars64.bat was not found.' }
          $testExe = Join-Path $env:RUNNER_TEMP 'BOOTSTRAP_QUEUE_STATE_TEST.exe'
          $testLog = Join-Path $env:RUNNER_TEMP 'BOOTSTRAP_QUEUE_STATE_TEST_RUN.txt'
          $testSources = @('tools\test_bootstrap_queue_state.cpp', 'directmotion\AsyncPipelineState.cpp') | ForEach-Object { Join-Path $env:GITHUB_WORKSPACE $_ }
          $sourceArguments = ($testSources | ForEach-Object { '"' + $_ + '"' }) -join ' '
          $command = '"' + $vcvars + '" >nul && cd /d "' + $env:RUNNER_TEMP + '" && cl /nologo /std:c++17 /EHsc ' + $sourceArguments + ' /Fe:"' + $testExe + '" && "' + $testExe + '" > "' + $testLog + '"'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap queue state regression tests failed with exit code $LASTEXITCODE" }
          Get-Content -LiteralPath $testLog

